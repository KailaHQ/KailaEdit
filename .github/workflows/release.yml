name: Release

# Two ways in, and they do different things:
#
#   Push a v* tag  — the real release. Builds installers on every platform and
#                    uploads them, with the latest*.yml files electron-updater
#                    needs, to a DRAFT GitHub Release. Publish the draft by hand
#                    once the artifacts look right: a bad release that is
#                    already public cannot be taken back from clients that have
#                    started downloading it.
#
#   Run it by hand — a dry run. Same build on every platform, but nothing is
#   (workflow_    ) published anywhere; the installers land in the run's
#   (dispatch     ) artifacts so you can download and test them. Use this to
#                   check a packaging change without minting a version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json produces installers whose
      # auto-update metadata points at a version nobody can find. Catch it here
      # rather than after four platform builds have burned CI minutes.
      # Only meaningful for a tag push: on workflow_dispatch GITHUB_REF_NAME is
      # the branch name, which is never going to look like a version.
      - name: Tag must match package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Releasing version $PKG"

      # The release body — and the "what's new" the in-app updater shows — is
      # cut out of CHANGELOG.md. A version with no entry there would publish an
      # empty release note, so stop here rather than after four platform builds.
      - name: CHANGELOG must describe this version
        if: github.ref_type == 'tag'
        run: node scripts/release-notes.cjs --check "${GITHUB_REF_NAME#v}"

      - name: Report dry run
        if: github.ref_type != 'tag'
        run: |
          PKG=$(node -p "require('./package.json').version")
          echo "Dry run from ${GITHUB_REF_NAME} — building version $PKG without publishing."

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test:run

      # Pre-create the GitHub Release before the parallel build matrix starts.
      # This guarantees that all platform runners upload assets to the exact
      # same release rather than racing and creating duplicate draft releases.
      - name: Initialize GitHub Release
        if: github.ref_type == 'tag'
        run: node scripts/init-release.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            ebArgs: --x64
          # One mac job for both architectures on purpose: macOS shares a single
          # latest-mac.yml, and only a run that packs both writes both zips into
          # it. The x64 app is cross-packed here — scripts/ffmpeg-per-arch.cjs
          # swaps in the Intel ffmpeg, since ffmpeg-static only ever installs
          # the build machine's own binary.
          - name: macos-arm64-and-x64
            os: macos-latest
            ebArgs: --arm64 --x64
          - name: linux-x64
            os: ubuntu-latest
            ebArgs: --x64
          # Linux is the opposite case: electron-builder writes a separate
          # latest-linux-arm64.yml, so a native arm64 runner is both cheaper and
          # safer than cross-packing.
          - name: linux-arm64
            os: ubuntu-24.04-arm
            ebArgs: --arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # A tag whose annotation carries [live] publishes straight away; anything
      # else lands as a draft. Reading the marker is best-effort on purpose:
      # if the tag object is not there, the answer stays "draft", which is the
      # safe direction to fail in.
      - name: Decide draft or published release
        id: release_type
        shell: bash
        run: |
          MODE=draft
          if [ "${{ github.ref_type }}" = "tag" ]; then
            MESSAGE=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" 2>/dev/null || true)
            case "$MESSAGE" in
              *"[live]"*) MODE=release ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Release type: $MODE"

      - name: Switch electron-builder to a published release
        if: steps.release_type.outputs.mode == 'release'
        shell: bash
        run: |
          node -e "
            const fs = require('fs')
            const f = 'electron-builder.yml'
            const before = fs.readFileSync(f, 'utf8')
            const after = before.replace('releaseType: draft', 'releaseType: release')
            if (after === before) { throw new Error('releaseType: draft not found in ' + f) }
            fs.writeFileSync(f, after)
          "

      # electron-builder publishes to the Release for the current tag and
      # generates latest.yml / latest-mac.yml / latest-linux.yml alongside the
      # installers. Nothing is signed yet, so Windows shows a SmartScreen
      # warning and macOS needs a right-click Open on first launch.
      - name: Build renderer and main process
        run: pnpm run build:frontend

      - name: Clean conflicting release assets
        if: github.ref_type == 'tag'
        run: node scripts/clean-platform-release-assets.cjs "${{ matrix.name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # `--publish always` only on a tag. A manual run must never upload: with
      # no tag there is no release to attach to, and electron-builder would
      # either fail or invent one from package.json.
      - name: Package${{ github.ref_type == 'tag' && ' and publish' || ' (dry run)' }}
        run: pnpm exec electron-builder --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }} ${{ matrix.ebArgs }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicitly off: signing without credentials fails the mac build
          # instead of quietly producing an unsigned app.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: komfyedit-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap

  # Runs once, after every platform has uploaded. Deliberately not part of the
  # matrix: four jobs racing to rewrite the same release body would be four
  # chances to clobber it, and electron-builder creates the release without one
  # anyway. `gh release edit` works on a draft, so the note is in place before
  # anyone publishes it.
  notes:
    name: Publish release notes
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Write the CHANGELOG section onto the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/publish-release-notes.cjs
