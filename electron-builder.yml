appId: com.kailaedit.app
productName: KailaEdit
copyright: Copyright © 2026 KailaEdit

directories:
  output: release
  buildResources: resources

# Auto-update source. electron-builder writes this block into app-update.yml
# inside the packaged app, which is the only place electron-updater reads it
# from, and uploads the artifacts plus latest*.yml to the matching GitHub
# Release. Public repo, so no token is needed by the client.
publish:
  provider: github
  owner: KailaHQ
  repo: KailaEdit
  # Draft by default: a bad release that is already public cannot be recalled
  # from clients that started downloading it. The release workflow rewrites
  # this single line to `release` when a tag is marked [live], so keep the
  # wording exactly as it is.
  releaseType: draft

# Runs the per-architecture ffmpeg swap and then checks the packed app for the
# things that fail silently — today, the window icon. See the scripts.
afterPack: scripts/after-pack.cjs

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - LICENSE.txt
  - NOTICES.md
  - resources/models/**
  - "!**/*.map"

asarUnpack:
  # ffmpeg must stay a real file on disk so it can be spawned as a child process.
  - node_modules/ffmpeg-static/**
  # @resvg/resvg-js reaches its native binding with a plain require of the
  # per-platform package (@resvg/resvg-js-win32-x64-msvc and friends). A .node
  # cannot be loaded from inside an asar, so these have to stay unpacked.
  - node_modules/@resvg/**
  # onnxruntime-node has native .node binding and shared libs (.dll / .dylib / .so)
  - node_modules/onnxruntime-node/**
  # Model weights for offline AI background removal
  - resources/models/**
  # Worker thread for parallel renderStroke must run from physical disk
  - dist-electron/stroke-worker.js
  # Worker thread for off-main-thread matte inference
  - dist-electron/matte-worker.js

extraResources:
  - from: resources/luts
    to: luts
  - from: resources/stickers
    to: stickers
  - from: resources/sfx
    to: sfx
  # createWindow() reads the window icon at runtime from <installdir>/resources.
  # The .ico under `directories.buildResources` is only an input to the
  # installer and the exe's own resources — nothing copies it into the app — so
  # a packaged run found no icon file and left the window without one.
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-win-${arch}-Setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: KailaEdit

mac:
  # Hardened Runtime is OFF while the app is unsigned, and turning it back on
  # without a Developer ID will crash the app at launch on Apple Silicon.
  #
  # arm64 requires a signature, so electron-builder falls back to an ad-hoc one
  # (macPackager.ts, fallBackToAdhoc). An ad-hoc signature carries no Team ID,
  # and Hardened Runtime enforces library validation — code may only load
  # libraries signed by the same team. The app loads @resvg/resvg-js's .node
  # binding and spawns the bundled ffmpeg, both signed separately, so the
  # kernel kills the process on launch.
  #
  # Hardened Runtime exists to satisfy notarization. Until there is a
  # Developer ID to notarize with, it buys nothing and only breaks things.
  # Set it back to true in the same change that adds `notarize: true`.
  hardenedRuntime: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Both architectures must come out of ONE electron-builder run: macOS has a
  # single latest-mac.yml for the whole platform, and MacUpdater picks the arm64
  # or the x64 zip out of its file list. Two separate jobs would each write that
  # file and the second would erase the first architecture's update channel.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: resources/icon.icns
  category: public.app-category.video
  # The arch must stay spelled "arm64": MacUpdater picks between the two builds
  # by searching for that exact substring in the filename (MacUpdater.js,
  # filterFilesForArch). A friendlier "mac-mx" would leave an Intel Mac free to
  # auto-update itself onto an Apple Silicon build it cannot run.
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - AppImage
    - deb
  icon: resources/icons
  category: Video
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
